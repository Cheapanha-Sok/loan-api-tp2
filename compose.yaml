services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: /app/model.joblib
      DATABASE_URL: postgresql://loans:loans_dev_only@db:5432/loans
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: loans
      POSTGRES_PASSWORD: loans_dev_only   # development-only password
      POSTGRES_DB: loans
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loans -d loans"]
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer:5
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
